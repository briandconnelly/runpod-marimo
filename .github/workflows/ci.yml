name: CI

# No workflow-level paths-ignore: a check filtered out that way is never
# created at all, so if branch protection requires it, a docs-only PR hangs
# on "Expected" forever. Instead the checksums job classifies the PR's files
# and the expensive jobs skip themselves — a job skipped via `if:` reports a
# "skipped" conclusion, which branch protection treats as satisfied.
on:
  pull_request:
    branches: [main]

# A new push to a PR supersedes the run on its previous head.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Renovate bumps a tool's *_VERSION ARG but cannot recompute its *_SHA256
  # sibling, so those PRs arrive with a stale checksum and die on the
  # Dockerfile's `sha256sum -c`. Repair them here, before anything is built.
  # The checksum keeps its value because it is computed once and committed:
  # every later rebuild is still locked to the bytes reviewed on this PR.
  checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.sync.outputs.ref }}
      # true only when this run pushed a checksum fix; that commit carries
      # [skip ci], so report-repaired-head posts this run's results on it.
      repaired: ${{ steps.sync.outputs.repaired }}
      code_changed: ${{ steps.changes.outputs.code_changed }}

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fetch base branch for the version-change interlock
        run: |
          git fetch --no-tags --depth=1 \
            "https://github.com/${{ github.repository }}" "${{ github.base_ref }}"

      - name: Sync pinned download checksums
        id: sync
        env:
          # A fork's branch is not writable from here, so report rather than repair.
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            scripts/sync-checksums.sh --check --base FETCH_HEAD
          else
            scripts/sync-checksums.sh --base FETCH_HEAD
          fi

          if git diff --quiet -- Dockerfile; then
            echo "Pinned checksums were already correct."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # [skip ci] is required, not cosmetic. A push made with
            # GITHUB_TOKEN spawns a pull_request run that GitHub parks at
            # action_required forever, which would leave the PR unmergeable.
            # The run doing the pushing already builds the fixed tree below,
            # so the suppressed run would only duplicate it.
            git commit -m "chore: sync pinned download checksums [skip ci]" -- Dockerfile
            git push
            echo "::notice::Refreshed stale download checksums and pushed the fix."
            echo "repaired=true" >>"$GITHUB_OUTPUT"
          fi

          echo "ref=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Classify changed files
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        # Docs-and-config-only PRs skip the image build and smoke test
        # (the successors of the old workflow-level paths-ignore list).
        # Everything else counts as code.
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "$files"
          code_changed=false
          while IFS= read -r f; do
            case "$f" in
              *.md|.gitignore|.claude/*|renovate.json) ;;
              *) code_changed=true ;;
            esac
          done <<< "$files"
          echo "code_changed=$code_changed" >>"$GITHUB_OUTPUT"

  # Nearly all executable code in this repo is shell (start script, checksum
  # sync, smoke tests), so lint it with the same rigor the image build gets.
  # Lints the tree as the checksums job left it, same as build/smoke-test.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checksums
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.checksums.outputs.ref }}

      - name: shellcheck
        # -x follows the `source common.sh` in the test entry points;
        # -P SCRIPTDIR resolves it relative to the sourcing script.
        run: shellcheck -x -P SCRIPTDIR start_marimo.sh scripts/*.sh tests/*.sh

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      # The variant READMEs are pasted into Runpod's pod-template
      # description field, which is capped at 5000 characters. Nothing
      # else in CI reads them, so an over-length one would only surface
      # when someone tried to publish the template.
      - name: Check pod-template README length
        run: scripts/check-readme-length.sh

  build:
    runs-on: ubuntu-latest
    needs: checksums
    # Skipped (not absent) on docs-only PRs so a required check still
    # reports a conclusion branch protection accepts.
    if: needs.checksums.outputs.code_changed == 'true'
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      actions: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: gpu
            description: "Marimo notebook server for Runpod GPU pods"
          - variant: cpu
            description: "Marimo notebook server for Runpod CPU pods"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the branch head as the checksums job left it, so a green
          # check always corresponds to the tree that gets merged.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.checksums.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image (${{ matrix.variant }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            VARIANT=${{ matrix.variant }}
            IMAGE_DESCRIPTION=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: [checksums, build]
    # Redundant with build's skip (a skipped need skips dependents), but
    # explicit so the intent survives refactors.
    if: needs.checksums.outputs.code_changed == 'true'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the branch head as the checksums job left it, so a green
          # check always corresponds to the tree that gets merged.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.checksums.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build CPU image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: runpod-marimo:smoke-test
          build-args: |
            VARIANT=cpu
            IMAGE_DESCRIPTION=Marimo notebook server for Runpod CPU pods
          cache-from: type=gha,scope=cpu

      - name: Run CPU smoke tests
        # Every suite lives in tests/ci-suites.sh so it can run locally too.
        run: tests/ci-suites.sh runpod-marimo:smoke-test

  # The checksum fix is pushed with [skip ci], so that commit, the PR's new
  # head, would otherwise carry no checks and need a manual retrigger. This
  # run already linted, built and tested exactly that tree, so mirror its
  # results onto the commit as statuses. Forks never reach this job: their
  # branch is only checked, never repaired, so `repaired` is never true.
  report-repaired-head:
    runs-on: ubuntu-latest
    needs: [checksums, lint, build, smoke-test]
    if: always() && needs.checksums.outputs.repaired == 'true'
    timeout-minutes: 5
    permissions:
      statuses: write

    steps:
      - name: Post check results on the repaired commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.checksums.outputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
          SMOKE_TEST: ${{ needs.smoke-test.result }}
        run: |
          post() {
            # A repair always changes the Dockerfile, so every job must
            # have run. "skipped" here means an upstream job failed (or
            # classification broke), never a legitimate docs-only skip.
            local job="$1" result="$2" state=failure
            [[ "$result" == success ]] && state=success
            gh api --method POST "repos/$REPO/statuses/$SHA" \
              -f state="$state" -f context="ci/$job" -f target_url="$RUN_URL" \
              -f description="$job: $result (from the run that pushed this commit)"
          }
          post lint "$LINT"
          post build "$BUILD"
          post smoke-test "$SMOKE_TEST"
