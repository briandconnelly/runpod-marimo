name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".claude/**"
      - "renovate.json"

jobs:
  # Renovate bumps a tool's *_VERSION ARG but cannot recompute its *_SHA256
  # sibling, so those PRs arrive with a stale checksum and die on the
  # Dockerfile's `sha256sum -c`. Repair them here, before anything is built.
  # The checksum keeps its value because it is computed once and committed:
  # every later rebuild is still locked to the bytes reviewed on this PR.
  checksums:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.sync.outputs.ref }}

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fetch base branch for the version-change interlock
        run: |
          git fetch --no-tags --depth=1 \
            "https://github.com/${{ github.repository }}" "${{ github.base_ref }}"

      - name: Sync pinned download checksums
        id: sync
        env:
          # A fork's branch is not writable from here, so report rather than repair.
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            scripts/sync-checksums.sh --check --base FETCH_HEAD
          else
            scripts/sync-checksums.sh --base FETCH_HEAD
          fi

          if git diff --quiet -- Dockerfile; then
            echo "Pinned checksums were already correct."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # [skip ci] is required, not cosmetic. A push made with
            # GITHUB_TOKEN spawns a pull_request run that GitHub parks at
            # action_required forever, which would leave the PR unmergeable.
            # The run doing the pushing already builds the fixed tree below,
            # so the suppressed run would only duplicate it.
            git commit -m "chore: sync pinned download checksums [skip ci]" -- Dockerfile
            git push
            echo "::notice::Refreshed stale download checksums and pushed the fix."
          fi

          echo "ref=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  # Nearly all executable code in this repo is shell (start script, checksum
  # sync, smoke tests), so lint it with the same rigor the image build gets.
  # Lints the tree as the checksums job left it, same as build/smoke-test.
  lint:
    runs-on: ubuntu-latest
    needs: checksums
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.checksums.outputs.ref }}

      - name: shellcheck
        # -x follows the `source common.sh` in the test entry points;
        # -P SCRIPTDIR resolves it relative to the sourcing script.
        run: shellcheck -x -P SCRIPTDIR start_marimo.sh scripts/*.sh tests/*.sh

      - name: hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  build:
    runs-on: ubuntu-latest
    needs: checksums
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      actions: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: gpu
            description: "Marimo notebook server for Runpod GPU pods"
          - variant: cpu
            description: "Marimo notebook server for Runpod CPU pods"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Build the branch head as the checksums job left it, so a green
          # check always corresponds to the tree that gets merged.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.checksums.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (${{ matrix.variant }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            VARIANT=${{ matrix.variant }}
            IMAGE_DESCRIPTION=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: [checksums, build]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Build the branch head as the checksums job left it, so a green
          # check always corresponds to the tree that gets merged.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.checksums.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CPU image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: runpod-marimo:smoke-test
          build-args: |
            VARIANT=cpu
            IMAGE_DESCRIPTION=Marimo notebook server for Runpod CPU pods
          cache-from: type=gha,scope=cpu

      - name: Run CPU smoke tests
        # One suite run per auth mode: the smoke tests assert different
        # things depending on MARIMO_TOKEN_PASSWORD / JUPYTER_PASSWORD /
        # MARIMO_DISABLE_AUTH, so each branch of the startup script's
        # token resolution gets exercised against a real container.
        run: |
          run_suite() {
            local name="$1"; shift
            echo "::group::smoke: $name"
            docker run -d --name marimo-ci "$@" \
              -v "$(pwd)/tests:/tests:ro" \
              -e MARIMO_CACHE_DIR=/home/runpod/.cache \
              runpod-marimo:smoke-test
            docker exec marimo-ci bash /tests/test-cpu.sh
            docker rm -f marimo-ci
            echo "::endgroup::"
          }
          run_suite "default (generated token)"
          run_suite "explicit password wins over JUPYTER_PASSWORD" \
            -e 'MARIMO_TOKEN_PASSWORD=sp3c!al ch@rs&?' -e JUPYTER_PASSWORD=from-jupyter
          run_suite "JUPYTER_PASSWORD fallback" -e JUPYTER_PASSWORD=from-jupyter
          run_suite "auth disabled" -e MARIMO_DISABLE_AUTH=true
