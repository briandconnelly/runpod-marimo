name: CI

# No workflow-level paths-ignore: a check filtered out that way is never
# created at all, so if branch protection requires it, a docs-only PR hangs
# on "Expected" forever. Instead the checksums job classifies the PR's files
# and the expensive jobs skip themselves — a job skipped via `if:` reports a
# "skipped" conclusion, which branch protection treats as satisfied.
on:
  pull_request:
    branches: [main]

jobs:
  # Renovate bumps a tool's *_VERSION ARG but cannot recompute its *_SHA256
  # sibling, so those PRs arrive with a stale checksum and die on the
  # Dockerfile's `sha256sum -c`. Repair them here, before anything is built.
  # The checksum keeps its value because it is computed once and committed:
  # every later rebuild is still locked to the bytes reviewed on this PR.
  checksums:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.sync.outputs.ref }}
      code_changed: ${{ steps.changes.outputs.code_changed }}

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fetch base branch for the version-change interlock
        run: |
          git fetch --no-tags --depth=1 \
            "https://github.com/${{ github.repository }}" "${{ github.base_ref }}"

      - name: Sync pinned download checksums
        id: sync
        env:
          # A fork's branch is not writable from here, so report rather than repair.
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            scripts/sync-checksums.sh --check --base FETCH_HEAD
          else
            scripts/sync-checksums.sh --base FETCH_HEAD
          fi

          if git diff --quiet -- Dockerfile; then
            echo "Pinned checksums were already correct."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # [skip ci] is required, not cosmetic. A push made with
            # GITHUB_TOKEN spawns a pull_request run that GitHub parks at
            # action_required forever, which would leave the PR unmergeable.
            # The run doing the pushing already builds the fixed tree below,
            # so the suppressed run would only duplicate it.
            git commit -m "chore: sync pinned download checksums [skip ci]" -- Dockerfile
            git push
            echo "::notice::Refreshed stale download checksums and pushed the fix."
          fi

          echo "ref=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Classify changed files
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        # Docs-and-config-only PRs skip the image build and smoke test
        # (the successors of the old workflow-level paths-ignore list).
        # Everything else counts as code.
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "$files"
          code_changed=false
          while IFS= read -r f; do
            case "$f" in
              *.md|.gitignore|.claude/*|renovate.json) ;;
              *) code_changed=true ;;
            esac
          done <<< "$files"
          echo "code_changed=$code_changed" >>"$GITHUB_OUTPUT"

  # Nearly all executable code in this repo is shell (start script, checksum
  # sync, smoke tests), so lint it with the same rigor the image build gets.
  # Lints the tree as the checksums job left it, same as build/smoke-test.
  lint:
    runs-on: ubuntu-latest
    needs: checksums
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.checksums.outputs.ref }}

      - name: shellcheck
        # -x follows the `source common.sh` in the test entry points;
        # -P SCRIPTDIR resolves it relative to the sourcing script.
        run: shellcheck -x -P SCRIPTDIR start_marimo.sh scripts/*.sh tests/*.sh

      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      # The variant READMEs are pasted into Runpod's pod-template
      # description field, which is capped at 5000 characters. Nothing
      # else in CI reads them, so an over-length one would only surface
      # when someone tried to publish the template.
      - name: Check pod-template README length
        run: scripts/check-readme-length.sh

  build:
    runs-on: ubuntu-latest
    needs: checksums
    # Skipped (not absent) on docs-only PRs so a required check still
    # reports a conclusion branch protection accepts.
    if: needs.checksums.outputs.code_changed == 'true'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      actions: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: gpu
            description: "Marimo notebook server for Runpod GPU pods"
          - variant: cpu
            description: "Marimo notebook server for Runpod CPU pods"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Build the branch head as the checksums job left it, so a green
          # check always corresponds to the tree that gets merged.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.checksums.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (${{ matrix.variant }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            VARIANT=${{ matrix.variant }}
            IMAGE_DESCRIPTION=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: [checksums, build]
    # Redundant with build's skip (a skipped need skips dependents), but
    # explicit so the intent survives refactors.
    if: needs.checksums.outputs.code_changed == 'true'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Build the branch head as the checksums job left it, so a green
          # check always corresponds to the tree that gets merged.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.checksums.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CPU image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: runpod-marimo:smoke-test
          build-args: |
            VARIANT=cpu
            IMAGE_DESCRIPTION=Marimo notebook server for Runpod CPU pods
          cache-from: type=gha,scope=cpu

      - name: Run CPU smoke tests
        # One suite run per auth mode: the smoke tests assert different
        # things depending on MARIMO_TOKEN_PASSWORD / JUPYTER_PASSWORD,
        # so each branch of the startup script's
        # token resolution gets exercised against a real container.
        run: |
          source tests/common.sh
          # run_suite_raw takes the docker-run flags verbatim; run_suite
          # adds the ephemeral-cache override most suites use.
          run_suite_raw() {
            local name="$1"; shift
            echo "::group::smoke: $name"
            docker run -d --name marimo-ci "$@" \
              -v "$(pwd)/tests:/tests:ro" \
              runpod-marimo:smoke-test
            # A suite that dies with the container (exit 137) otherwise
            # leaves no trace of why marimo stopped.
            docker exec marimo-ci bash /tests/test-cpu.sh || {
              docker inspect --format 'container: running={{.State.Running}} exit={{.State.ExitCode}} oomkilled={{.State.OOMKilled}}' marimo-ci
              echo "--- docker logs marimo-ci ---"; docker logs marimo-ci 2>&1 | tail -n 100
              exit 1
            }
            if [[ "${EXPECT_CHOWN_WARNINGS:-false}" == true ]]; then
              docker logs marimo-ci > "$RUNNER_TEMP/chown.log" 2>&1
              for dir in /workspace /workspace/.cache /workspace/.cache/uv /workspace/.cache/huggingface; do
                check "denied chown warns for $dir" \
                  grep -qF "Warning: could not chown '$dir' to runpod;" "$RUNNER_TEMP/chown.log"
              done
            fi
            if [[ "${EXPECT_CHMOD_FALLBACK:-false}" == true ]]; then
              for dir in /workspace/.cache /workspace/.cache/uv /workspace/.cache/huggingface; do
                check "denied chown falls back to chmod for $dir" \
                  grep -qF "Warning: could not chown '$dir' to runpod; made it world-writable (mode 1777) instead." "$RUNNER_TEMP/chown.log"
                check "$dir is mode 1777" eq "$(docker exec marimo-ci stat -c %a "$dir")" 1777
              done
            fi
            docker rm -f marimo-ci
            echo "::endgroup::"
          }
          run_suite() {
            local name="$1"; shift
            run_suite_raw "$name" -e MARIMO_CACHE_DIR=/home/runpod/.cache "$@"
          }
          run_suite "default (generated token)"
          run_suite "explicit password wins over JUPYTER_PASSWORD" \
            -e 'MARIMO_TOKEN_PASSWORD=sp3c!al ch@rs&?' -e JUPYTER_PASSWORD=from-jupyter
          run_suite "JUPYTER_PASSWORD fallback" -e JUPYTER_PASSWORD=from-jupyter
          # An inbound MARIMO_TOKEN must never survive into the shell
          # environment, where it would shadow the resolved token.
          run_suite "inbound MARIMO_TOKEN does not shadow the resolved one" \
            -e MARIMO_TOKEN=poisoned-inbound-value
          # Existing templates still carry the old documented default
          # MARIMO_DISABLE_AUTH=false; it must boot normally with auth on.
          run_suite "legacy MARIMO_DISABLE_AUTH=false keeps auth on" \
            -e MARIMO_DISABLE_AUTH=false
          # Running without a token is not possible: the removed opt-out
          # must stop the pod rather than start marimo unauthenticated.
          docker run -d --name marimo-ci -e MARIMO_DISABLE_AUTH=true \
            -e MARIMO_CACHE_DIR=/home/runpod/.cache runpod-marimo:smoke-test
          check "MARIMO_DISABLE_AUTH=true refuses to start" \
            eq "$(timeout 60 docker wait marimo-ci)" 1
          docker logs marimo-ci > "$RUNNER_TEMP/noauth.log" 2>&1
          check "MARIMO_DISABLE_AUTH=true reports why" \
            grep -qF "Error: MARIMO_DISABLE_AUTH is no longer supported" "$RUNNER_TEMP/noauth.log"
          docker rm -f marimo-ci
          # #50: the default cache root is <workspace>/.cache, so an empty
          # /workspace stands in for a freshly attached network volume. With
          # no network at all, marimo must still start from the image's
          # prewarmed cache. #116: the suite also requires a seed marker and
          # builds a notebook sandbox offline from the persistent cache.
          run_suite_raw "first boot on an empty persistent cache, no network" \
            --network none
          # #115: dropping CHOWN produces real EPERM errors. umask 000
          # leaves new root-owned dirs usable by runpod. Supplementary
          # runpod membership lets root install the root:runpod env file
          # without CHOWN; the token file is created as runpod, so auth
          # stays on.
          EXPECT_CHOWN_WARNINGS=true run_suite_raw "denied chown, writable caches" \
            --cap-drop CHOWN --group-add runpod --tmpfs /workspace:mode=1777 \
            --entrypoint /tests/start-no-chown.sh
          # With the normal umask, new directories come out root-owned 0755,
          # as on Runpod's NFS pod volumes. Startup must chmod them 1777 so
          # marimo still starts on the first boot.
          EXPECT_CHOWN_WARNINGS=true EXPECT_CHMOD_FALLBACK=true \
            run_suite_raw "denied chown, umask 022 (NFS-like) caches" \
            --cap-drop CHOWN --group-add runpod --tmpfs /workspace:mode=1777 \
            --entrypoint /tests/start-no-chown.sh -e TEST_UMASK=022
          # A pre-existing cache directory runpod cannot write is left alone,
          # so it must reach the probe's clear error on the first boot rather
          # than dying at the chown, which is what made each restart create
          # one more directory.
          docker run -d --name marimo-ci --cap-drop CHOWN \
            --tmpfs /workspace:mode=1777 --entrypoint /tests/start-no-chown.sh \
            -e TEST_UMASK=022 -e TEST_PRECREATE_UNWRITABLE=/workspace/.cache/uv \
            -v "$(pwd)/tests:/tests:ro" runpod-marimo:smoke-test
          check "unwritable cache fails on first boot" eq "$(timeout 30 docker wait marimo-ci)" 1
          docker logs marimo-ci > "$RUNNER_TEMP/chown.log" 2>&1
          check "unwritable cache reports the probe error" \
            grep -qF "Error: UV_CACHE_DIR '/workspace/.cache/uv' is not writable by the runpod user." "$RUNNER_TEMP/chown.log"
          check "unwritable cache: chown denial is not itself fatal" \
            not grep -qF "Error: failed to chown" "$RUNNER_TEMP/chown.log"
          docker rm -f marimo-ci
          summary
